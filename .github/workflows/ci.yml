name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check Markdown links and tables
        run: python3 tools/check_docs.py
      - name: Check whitespace errors in the latest change
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
      - name: Keep local corpus and fuzz material out of Git
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(testdata/(compatibility_corpus|fuzz)/|_TEMP/)'; then
            echo 'Local validation material must remain untracked.' >&2
            exit 1
          fi

  linux-gcc:
    name: Linux GCC release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci-linux-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGIFLIB_BUILD_TESTS=ON
          -DGIFLIB_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build/ci-linux-gcc --parallel
      - name: Run tests
        run: ctest --test-dir build/ci-linux-gcc --output-on-failure --no-tests=error
      - name: Check installation layout
        run: cmake --install build/ci-linux-gcc --prefix "$GITHUB_WORKSPACE/build/ci-install"

  linux-gcc-burst-read:
    name: Linux GCC BURST_READ and Disposal 3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci-linux-gcc-burst-read -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGIFLIB_BUILD_TESTS=ON
          -DGIFLIB_BUILD_EXAMPLES=ON
          -DGIFLIB_ENABLE_BURST_READ=ON
          -DGIFLIB_ENABLE_DISPOSAL_METHOD_3=ON
      - name: Build
        run: cmake --build build/ci-linux-gcc-burst-read --parallel
      - name: Run tests
        run: ctest --test-dir build/ci-linux-gcc-burst-read --output-on-failure --no-tests=error

  linux-clang-sanitized:
    name: Linux Clang ASan UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci-linux-clang-sanitized -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DGIFLIB_ENABLE_HOST_SANITIZERS=ON
          -DGIFLIB_BUILD_TESTS=ON
          -DGIFLIB_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build/ci-linux-clang-sanitized --parallel
      - name: Run tests
        run: ctest --test-dir build/ci-linux-clang-sanitized --output-on-failure --no-tests=error

  windows-msvc:
    name: Windows MSVC release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci-windows-msvc
          -G "Visual Studio 17 2022" -A x64
          -DGIFLIB_BUILD_TESTS=ON
          -DGIFLIB_BUILD_EXAMPLES=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/ci-windows-msvc --config Release --parallel
      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/ci-windows-msvc -C Release --output-on-failure --no-tests=error
      - name: Check installation layout
        shell: pwsh
        run: cmake --install build/ci-windows-msvc --config Release --prefix "$env:GITHUB_WORKSPACE/build/ci-install"

  arm-static:
    name: ARM C-library profiles and heap audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            picolibc-arm-none-eabi
      - name: Build C-library profiles and PRIVATE static library
        shell: bash
        run: |
          set -euo pipefail

          configure_and_build() {
            local profile="$1"
            local backend="$2"
            local specs_option="$3"
            local build_dir="build/ci-arm-${profile}"
            local cmake_args=(
              -S . -B "$build_dir" -G Ninja
              -DCMAKE_SYSTEM_NAME=Generic
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
              -DCMAKE_C_COMPILER=arm-none-eabi-gcc
              -DCMAKE_BUILD_TYPE=Release
              -DGIFLIB_BUILD_TESTS=OFF
              -DGIFLIB_BUILD_EXAMPLES=OFF
              "-DGIF_MEM_BACKEND=$backend"
            )
            if [[ -n "$specs_option" ]]; then
              cmake_args+=("-DCMAKE_C_FLAGS:STRING=$specs_option")
            fi

            cmake "${cmake_args[@]}"
            cmake --build "$build_dir" --parallel
          }

          configure_and_build newlib BUILTIN ''
          configure_and_build newlib-nano BUILTIN '--specs=nano.specs'
          configure_and_build picolibc BUILTIN '--specs=picolibc.specs'
          configure_and_build private-newlib PRIVATE ''
      - name: Confirm selected C library archives
        shell: bash
        run: |
          set -euo pipefail

          link_profile() {
            local profile="$1"
            local specs_option="$2"
            local expected_archive_pattern="$3"
            local build_dir="build/ci-arm-${profile}"
            local trace_file="$build_dir/libc-link-trace.txt"
            local compiler_options=()
            if [[ -n "$specs_option" ]]; then
              compiler_options+=("$specs_option")
            fi

            arm-none-eabi-gcc "${compiler_options[@]}" -r -Wl,-t \
              -Wl,--whole-archive "$build_dir/libgiflib_embedded.a" \
              -Wl,--no-whole-archive -Wl,--undefined=memset -lc \
              -o "$build_dir/libc-link-check.o" >"$trace_file" 2>&1

            if ! grep -Eq 'libc(_nano)?\.a' "$trace_file"; then
              echo "${profile}: the relocatable link did not select a C library archive." >&2
              cat "$trace_file" >&2
              exit 1
            fi
            if [[ -n "$expected_archive_pattern" ]] && \
               ! grep -Eq "$expected_archive_pattern" "$trace_file"; then
              echo "${profile}: expected C library archive was not selected." >&2
              cat "$trace_file" >&2
              exit 1
            fi
          }

          link_profile newlib '' ''
          link_profile newlib-nano '--specs=nano.specs' 'libc_nano\.a'
          link_profile picolibc '--specs=picolibc.specs' 'picolibc.*libc\.a'
      - name: Audit allocator references
        shell: bash
        run: |
          set -euo pipefail
          newlib_symbols=build/ci-arm-newlib/undefined-symbols.txt
          nano_symbols=build/ci-arm-newlib-nano/undefined-symbols.txt
          picolibc_symbols=build/ci-arm-picolibc/undefined-symbols.txt
          private_symbols=build/ci-arm-private-newlib/undefined-symbols.txt
          arm-none-eabi-nm -u build/ci-arm-newlib/libgiflib_embedded.a | tee "$newlib_symbols"
          arm-none-eabi-nm -u build/ci-arm-newlib-nano/libgiflib_embedded.a | tee "$nano_symbols"
          arm-none-eabi-nm -u build/ci-arm-picolibc/libgiflib_embedded.a | tee "$picolibc_symbols"
          arm-none-eabi-nm -u build/ci-arm-private-newlib/libgiflib_embedded.a | tee "$private_symbols"

          if grep -Eq '(^|[[:space:]])(malloc|calloc|realloc|free)$' \
            "$newlib_symbols" "$nano_symbols" "$picolibc_symbols" "$private_symbols"; then
            echo 'A no-libc-heap backend references a C library heap symbol.' >&2
            exit 1
          fi

          for symbol in gif_mem_private_malloc gif_mem_private_realloc gif_mem_private_free; do
            if ! grep -Eq "[[:space:]]U[[:space:]]${symbol}$" "$private_symbols"; then
              echo "PRIVATE build is missing expected provider symbol: ${symbol}" >&2
              exit 1
            fi
          done
